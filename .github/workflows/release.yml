name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: false # never restore caches into a release build
      - name: Tag matches both package versions
        run: |
          version="$(node -p 'require("./package.json").version')"
          site="$(node -p 'require("./packages/site/package.json").version')"
          peer="$(node -p 'require("./package.json").peerDependencies["@rulebookguard/site"]')"
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$site" != "$version" ] || [ "$peer" != "^$version" ]; then
            echo "Tag $GITHUB_REF_NAME, package.json version $version, packages/site version $site and peer range $peer must agree" >&2
            exit 1
          fi
      - run: vp check
      - run: vp test
      - run: vp pack
      - run: npm install --global npm@11.21.0 # trusted publishing needs npm >= 11.5.1
      - name: Publish @rulebookguard/site
        run: npm publish --access public
        working-directory: packages/site
      # npm does not rewrite pnpm's workspace: protocol, so pin the dev link to the version just published.
      - name: Pin the site dev dependency to the released version
        run: npm pkg set "devDependencies.@rulebookguard/site=$(node -p 'require("./package.json").version')"
      - run: npm publish
