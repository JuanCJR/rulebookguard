packages:
  - packages/*

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5
  magic-string: 1.4.3

# @rulebookguard/symbols ships only the .wasm grammars of these packages, never their native addon.
allowBuilds:
  tree-sitter-c-sharp: false
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
